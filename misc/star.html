<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Animation</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            height: 100svh;
            background-color: red;
            display: grid;
            place-items: center;
        }

        .star-container {
            width: min(100vw, 100vh);
            height: min(100vw, 100vh);
        }

        .concentric-star-sprite {
            transform-box: fill-box;
            transform-origin: center;
            animation: shrink 6s linear infinite;
            will-change: transform;
        }

        .star-black {
            fill: #000;
        }

        .star-white {
            fill: #fff;
        }

        @keyframes shrink {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(0);
            }
        }
    </style>
</head>

<body>

    <div class="star-container" style="background-color: blue;">
        <svg viewBox="0 0 500 500" width="100%" height="100%">
            <defs>
                <polygon id="star" points="250,25 315,160 465,180 355,285 385,435 250,360 115,435 145,285 35,180 185,160" />

                <clipPath id="starClip">
                    <use href="#star" fill="white" style="transform: scale(0.85); transform-origin: center;" />
                </clipPath>
            </defs>

            <g id="concentric-star-sprite-container" clip-path="url(#starClip)">
                <use href="#star" class="concentric-star-sprite star-black" />
                <use href="#star" class="concentric-star-sprite star-white" />
                <use href="#star" class="concentric-star-sprite star-black" />
                <use href="#star" class="concentric-star-sprite star-white" />
                <use href="#star" class="concentric-star-sprite star-black" />
                <use href="#star" class="concentric-star-sprite star-white" />
            </g>
        </svg>
    </div>

    <script>
        const concentricStarSpriteContainerRef = document.querySelector("#concentric-star-sprite-container");
        const concentricStarSpriteRefs = concentricStarSpriteContainerRef.querySelectorAll(".concentric-star-sprite");
        const count = concentricStarSpriteRefs.length;
        const duration = 6000;

        concentricStarSpriteRefs.forEach((concentricStarSprite, i) => {
            concentricStarSprite.style.animationDelay = `${-(i / count) * duration}ms`;

            concentricStarSprite.addEventListener("animationiteration", () => {
                concentricStarSprite.style.animationDelay = "0ms";
                concentricStarSpriteContainerRef.prepend(concentricStarSprite);
            });
        });
    </script>
</body>

</html>
